# Configuración de cSpell (VS Code y CLI) para el repositorio SSCE0110.
#
# El proyecto está en español: además del diccionario inglés que trae cSpell se
# carga el diccionario oficial español @cspell/dict-es-es (252 KB, comprimido),
# copiado en .cspell/ para no depender de npm. Licencia en
# .cspell/COPYING-dict-es-es.txt. Si actualizas el diccionario, sustituye
# .cspell/es-es.trie.gz por el Spanish.trie.gz del paquete.
#
# Sólo hay que añadir palabras a `words` cuando sean del dominio (siglas, nombres
# propios, identificadores del código) y no estén en ninguno de los diccionarios.
version: "0.2"
language: en
dictionaryDefinitions:
  - name: es-es
    path: ./.cspell/es-es.trie.gz
    addWords: false
dictionaries:
  - es-es
ignorePaths:
  - .git/**
  - "**/*.pdf"
  - "**/*.docx"
  - "**/*.pptx"
  - "MF1442_3/fuentes/*.fodt"
  - "MF1442_3/fuentes/*.fodp"
